<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abundia</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="search-container">
    <input type="text" id="product-search" placeholder="Buscar en Abundia...">
    <span class="search-icon">🔍</span>
  </div>

  <header>
    <div class="logo-container">
      <img src="img/logo-abundia.png" alt="Logo Abundia" class="header-logo">
    </div>
    <button id="toggle-cart" class="toggle-cart-button">
      <span class="cart-icon">👜</span> 
      <span class="cart-text">Ver carrito</span> 
      <span id="cart-count-badge" class="main-badge">0</span>
    </button>
  </header>
  
  <nav>
    <ul id="categories">
      <li data-category="cocina">Cocina</li>
      <li data-category="vasos y copas">Vasos y Copas</li>
      <li data-category="decoracion">Decoracion</li>
      <li data-category="habitacion">Habitacion</li>
      <li data-category="textil">Textil</li>
      <li data-category="organizacion">Organizacion</li>
      <li data-category="baño">Baño</li>
      <li data-category="combos">Combos</li>
    </ul>
  </nav>

  <main id="product-list"></main>

  <div id="cart">
    <button id="toggle-cart-inside" class="toggle-cart-button" style="float: right;">❌</button>
    <h2>Carrito (<span id="cart-count">0</span>)</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total: $<span id="cart-total">0</span></strong></p>
    <button id="whatsapp-btn">Finalizar pedido por WhatsApp</button>
  </div>

</body>
</html>
